services:
	app:
		build:
			context: ..
			dockerfile: docker/dockerfile
		ports:
			- "${SERVER_PORT:-8080}:8080"
		environment:
			SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
			DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-mpesa}
			DB_USERNAME: ${POSTGRES_USER:-mpesa}
			DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
			DB_DRIVER: org.postgresql.Driver
			DDL_AUTO: validate
			API_USERNAME: ${API_USERNAME:-api-client}
			API_PASSWORD: ${API_PASSWORD:?API_PASSWORD is required}
			MPESA_BASE_URL: ${MPESA_BASE_URL:-https://sandbox.safaricom.co.ke}
			MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:?MPESA_CONSUMER_KEY is required}
			MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:?MPESA_CONSUMER_SECRET is required}
			MPESA_SHORTCODE: ${MPESA_SHORTCODE:-174379}
			MPESA_PASSKEY: ${MPESA_PASSKEY:?MPESA_PASSKEY is required}
			MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL:?MPESA_CALLBACK_URL is required}
		depends_on:
			db:
				condition: service_healthy

	db:
		image: postgres:16-alpine
		environment:
			POSTGRES_DB: ${POSTGRES_DB:-mpesa}
			POSTGRES_USER: ${POSTGRES_USER:-mpesa}
			POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
		volumes:
			- mpesa-db:/var/lib/postgresql/data
		healthcheck:
			test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mpesa} -d ${POSTGRES_DB:-mpesa}"]
			interval: 5s
			timeout: 5s
			retries: 10

volumes:
	mpesa-db:
